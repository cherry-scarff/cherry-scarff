<svg xmlns="http://w3.org" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <!-- Основной вишневый градиент для букв -->
    <linearGradient id="cherry-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f05287"/>
      <stop offset="50%" stop-color="#ce70ad"/>
      <stop offset="100%" stop-color="#ffb4d0"/>
    </linearGradient>
    
    <!-- Темный градиент для создания объемной 3D тени -->
    <linearGradient id="shadow-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a1525"/>
      <stop offset="50%" stop-color="#3c182e"/>
      <stop offset="100%" stop-color="#4a2635"/>
    </linearGradient>
  </defs>

  <!-- Фон терминала -->
  <rect width="1200" height="660" fill="#181818"/>

  <!-- Шапка окна в стиле macOS -->
  <rect width="1200" height="35" fill="#222222"/>
  <circle cx="25" cy="17.5" r="6" fill="#ff5f57"/>
  <circle cx="45" cy="17.5" r="6" fill="#febc2e"/>
  <circle cx="65" cy="17.5" r="6" fill="#28c840"/>
  <text x="600" y="22" fill="#8d858b" font-family="monospace" font-size="14" text-anchor="middle">cherry — projects</text>

  <!-- Пиксельный шеврон ">" слева от логотипа -->
  <g fill="#f05287" shape-rendering="crispEdges" transform="translate(40, 90) scale(15)">
    <path d="M0 0h2v2H0z M2 2h2v2H2z M4 4h2v2H4z M2 6h2v2H2z M0 8h2v2H0z"/>
  </g>

  <!-- НАДПИСЬ CHERRY С ПИКСЕЛЬНОЙ ТЕНЬЮ (Сдвиг на +12px по X и Y) -->
  <g shape-rendering="crispEdges">
    <!-- Слой тени -->
    <g fill="url(#shadow-grad)">
      <!-- C -->
      <path transform="translate(182 102) scale(15)" d="M1 0h4v1H1z M0 1h1v5H0z M1 6h4v1H1z"/>
      <!-- H -->
      <path transform="translate(292 102) scale(15)" d="M0 0h1v7H0z M4 0h1v7H4z M1 3h3v1H1z"/>
      <!-- E -->
      <path transform="translate(402 102) scale(15)" d="M0 0h5v1H0z M0 1h1v5H0z M0 3h4v1H0z M0 6h5v1H0z"/>
      <!-- R -->
      <path transform="translate(512 102) scale(15)" d="M0 0h4v1H0z M0 1h1v6H0z M4 1h1v2H4z M1 3h3v1H1z M2 4h1v1H2z M3 5h1v1H3z M4 6h1v1H4z"/>
      <!-- R -->
      <path transform="translate(622 102) scale(15)" d="M0 0h4v1H0z M0 1h1v6H0z M4 1h1v2H4z M1 3h3v1H1z M2 4h1v1H2z M3 5h1v1H3z M4 6h1v1H4z"/>
      <!-- Y -->
      <path transform="translate(732 102) scale(15)" d="M0 0h1v3H0z M4 0h1v3H4z M1 3h1v1H1z M3 3h1v1H3z M2 4h1v3H2z"/>
    </g>

    <!-- Основной слой (Буквы) -->
    <g fill="url(#cherry-grad)">
      <!-- C -->
      <path transform="translate(170 90) scale(15)" d="M1 0h4v1H1z M0 1h1v5H0z M1 6h4v1H1z"/>
      <!-- H -->
      <path transform="translate(280 90) scale(15)" d="M0 0h1v7H0z M4 0h1v7H4z M1 3h3v1H1z"/>
      <!-- E -->
      <path transform="translate(390 90) scale(15)" d="M0 0h5v1H0z M0 1h1v5H0z M0 3h4v1H0z M0 6h5v1H0z"/>
      <!-- R -->
      <path transform="translate(500 90) scale(15)" d="M0 0h4v1H0z M0 1h1v6H0z M4 1h1v2H4z M1 3h3v1H1z M2 4h1v1H2z M3 5h1v1H3z M4 6h1v1H4z"/>
      <!-- R -->
      <path transform="translate(610 90) scale(15)" d="M0 0h4v1H0z M0 1h1v6H0z M4 1h1v2H4z M1 3h3v1H1z M2 4h1v1H2z  M3 5h1v1H3z M4 6h1v1H4z"/>
      <!-- Y -->
      <path transform="translate(720 90) scale(15)" d="M0 0h1v3H0z M4 0h1v3H4z M1 3h1v1H1z M3 3h1v1H3z M2 4h1v3H2z"/>
    </g>
  </g>

  <!-- Блок подсказок (Tips for getting started) -->
  <g font-family="monospace" font-size="16" fill="#cccccc">
    <text x="40" y="260" fill="#ffffff">Tips for getting started:</text>
    <text x="40" y="290">1. Ask questions, edit files, or run commands.</text>
    <text x="40" y="315">2. Be specific for the best results.</text>
    <text x="40" y="340">3. /help for more information.</text>
  </g>

  <!-- Информационная строка о серверах -->
  <text x="40" y="420" font-family="monospace" font-size="16" fill="#666666">Using 1 CHERRY.md file and 5 MCP servers (ctrl+t to view)</text>

  <!-- Поле ввода (Input Box) -->
  <rect x="40" y="445" width="1120" height="50" rx="6" fill="none" stroke="#444444" stroke-width="1.5"/>
  <!-- Шеврон внутри ввода -->
  <path d="M 55 463 L 63 470 L 55 477" fill="none" stroke="#888888" stroke-width="2"/>
  <!-- Курсор -->
  <rect x="75" y="458" width="12" height="24" fill="#ffffff"/>
  <!-- Текст-плейсхолдер -->
  <text x="95" y="475" font-family="monospace" font-size="16" fill="#888888">Type your message or @path/to/file</text>

  <!-- Нижний статус-бар (Status Bar) -->
  <g font-family="monospace" font-size="15">
    <text x="40" y="580" fill="#888888">~/projects</text>
    <text x="600" y="580" fill="#f05287" text-anchor="middle">no sandbox <tspan fill="#666666">(see /docs)</tspan></text>
    <text x="1160" y="580" fill="#888888" text-anchor="end">cherry-2.5-pro <tspan fill="#666666">(100% context left)</tspan></text>
  </g>
</svg>
