
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310">
  <defs>
    <linearGradient id="cherry" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff365f"/>
      <stop offset="32%" stop-color="#f05287"/>
      <stop offset="67%" stop-color="#ce70ad"/>
      <stop offset="100%" stop-color="#ffb4d0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="310" fill="#101010"/>

  <!-- Terminal header -->
  <rect width="1200" height="26" fill="#191919"/>
  <circle cx="17" cy="13" r="4" fill="#ff5f57"/>
  <circle cx="31" cy="13" r="4" fill="#febc2e"/>
  <circle cx="45" cy="13" r="4" fill="#28c840"/>
  <text x="600" y="17" fill="#8d858b" font-family="monospace" font-size="10" text-anchor="middle">cherry — projects</text>

  <!-- Pixel letters: 5 x 7 grid -->
  <g fill="url(#cherry)" shape-rendering="crispEdges">

    <!-- C -->
    <path transform="translate(190 53) scale(24)" d="
      M1 0h4v1H1z M0 1h1v1H0z
      M0 2h1v1H0z M0 3h1v1H0z
      M0 4h1v1H0z M0 5h1v1H0z
      M1 6h4v1H1z"/>

    <!-- H -->
    <path transform="translate(330 53) scale(24)" d="
      M0 0h1v7H0z M4 0h1v7H4z
      M1 3h3v1H1z"/>

    <!-- E -->
    <path transform="translate(470 53) scale(24)" d="
      M0 0h5v1H0z M0 1h1v1H0z
      M0 2h1v1H0z M0 3h4v1H0z
      M0 4h1v1H0z M0 5h1v1H0z
      M0 6h5v1H0z"/>

    <!-- R -->
    <path transform="translate(610 53) scale(24)" d="
      M0 0h4v1H0z M0 1h1v1H0z
      M4 1h1v2H4z M0 2h1v1H0z
      M0 3h4v1H0z M0 4h1v1H0z
      M2 4h1v1H2z M0 5h1v1H0z
      M3 5h1v1H3z M0 6h1v1H0z
      M4 6h1v1H4z"/>

    <!-- R -->
    <path transform="translate(750 53) scale(24)" d="
      M0 0h4v1H0z M0 1h1v1H0z
      M4 1h1v2H4z M0 2h1v1H0z
      M0 3h4v1H0z M0 4h1v1H0z
      M2 4h1v1H2z M0 5h1v1H0z
      M3 5h1v1H3z M0 6h1v1H0z
      M4 6h1v1H4z"/>

    <!-- Y -->
    <path transform="translate(890 53) scale(24)" d="
      M0 0h1v2H0z M4 0h1v2H4z
      M1 2h1v1H1z M3 2h1v1H3z
      M2 3h1v4H2z"/>

  </g>

  <!-- Cherry pixel accents -->
  <g fill="#ff456d" shape-rendering="crispEdges">
    <rect x="1050" y="66" width="20" height="20"/>
    <rect x="1070" y="86" width="20" height="20"/>
    <rect x="1030" y="86" width="20" height="20"/>
    <rect x="1050" y="106" width="20" height="20"/>
  </g>
  <path d="M1060 65 Q1070 43 1090 48" fill="none" stroke="#83a96b" stroke-width="4"/>

  <!-- Terminal-style subtitle -->
  <text x="42" y="258" fill="#d4c7cf" font-family="monospace" font-size="15">Tips for getting started:</text>
  <text x="42" y="280" fill="#ff8fb2" font-family="monospace" font-size="13">01. create something sweet</text>
  <text x="42" y="298" fill="#b8aab3" font-family="monospace" font-size="13">02. stay curious. stay cherry.</text>
</svg>
